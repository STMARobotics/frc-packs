[package]
name = "frc-packs-server"
version = "0.1.0"
edition = "2024"
# The oldest Rust the locked dependencies build with.
rust-version = "1.89"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.11"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
# Only for running on AWS Lambda: cargo build --release --features lambda (see docs/aws.md).
lambda_http = { version = "1.3.1", optional = true }
web-push-native = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aws-config = { version = "1.8.13", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.104.0"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
chrono-tz = "0.10.4"
hex = "0.4.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
lambda = ["dep:lambda_http"]
