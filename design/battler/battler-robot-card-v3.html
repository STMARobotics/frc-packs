<!doctype html><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Battler robot card v3</title>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Lilita+One&display=swap">
<link rel=stylesheet href="../../web/src/style.css"><link rel=stylesheet href="battler-card.css"><link rel=stylesheet href="battler-card-v2.css"><link rel=stylesheet href="battler-card-v3.css">
<body class="bt-sheet"><style>.slot .edge,.shade{display:none}</style><div id="cards"></div><script>
/* Battler robot card v3: all five pack tiers (the same frames, rings and accents as the pack cards, from style.css), the
   rarity star scale on the frame, and the stats the battler reads (from tools/battler_stats.py, via the pack recipe's
   "bt" field). The numbers below are samples until Statbotics is back up. A card with no effect gets the placeholder. */
var CARDS = [
  { num: 3044, name: "Team 0xBE4", loc: "New York", yr: 2026, tier: "common", f: [0.51, 0.53], bt: { auto: 12, tele: 31, end: 6, rp: [22, 14, 8] } },
  { num: 1714, name: "MORE Robotics", loc: "Wisconsin", yr: 2026, tier: "uncommon", f: [0.54, 0.468], bt: { auto: 16, tele: 40, end: 9, rp: [31, 20, 11] } },
  { num: 7028, name: "Binary Battalion", loc: "Minnesota", yr: 2026, tier: "rare", avatar: "7028-2026", f: [0.543, 0.476], bt: { auto: 24, tele: 58, end: 14, rp: [48, 35, 12] }, effect: "+5 RP2 chance while in Station 2." },
  { num: 3476, name: "Code Orange", loc: "California", yr: 2025, tier: "legendary", avatar: "3476-2025", f: [0.457, 0.466], bt: { auto: 21, tele: 49, end: 22, rp: [55, 38, 31] }, effect: "If a VISION part is attached, +10 Auto." },
  { num: 4414, name: "HighTide", loc: "California", yr: 2026, tier: "mythic", avatar: "4414-2026", f: [0.518, 0.48], bt: { auto: 30, tele: 72, end: 18, rp: [62, 41, 27] }, effect: "+8 Tele for each MECHANICAL part attached." }
];
var STARS = { common: 1, uncommon: 2, rare: 3, legendary: 4, mythic: 5 };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function stars(tier) { var n = STARS[tier], s = ""; for (var i = 0; i < 5; i++) s += i < n ? "★" : "<i>★</i>"; return s; }
function card(c) {
  var bt = c.bt, nl = c.name.length > 14 ? 0.85 : 1;
  var av = c.avatar ? '<span class="avatar"><img src="avatars/' + c.avatar + '.png" alt=""></span>' : '<span class="avatar none">' + c.num + '</span>';
  var effect = c.effect ? '<p>' + esc(c.effect) + '</p>' : '<p class="tbd">Effect coming soon</p>';
  return '<div class="slot flipped" style="--tc:#fff"><div class="float"><div class="tilt rest"><div class="flip card" data-tier="' + c.tier + '"><div class="face front">' +
    '<div class="inner v2 bt b2" style="--nl:' + nl + '"><div class="head">' + av + '<span class="tname">' + esc(c.name) + '</span></div>' +
    '<div class="fwrap"><div class="fphoto"><span class="phw"><img class="ph" data-fx="' + c.f[0] + '" data-fy="' + c.f[1] + '" src="../../data/photos/' + c.num + '.webp" alt=""></span></div>' +
    '<div class="idbar"><span class="num">#' + c.num + '</span><span class="loc">' + esc(c.loc) + '</span><span class="yr">' + c.yr + '</span></div></div>' +
    '<div class="statrow"><div class="stat"><small>AUTO</small><b>' + bt.auto + '</b></div><div class="stat"><small>TELE</small><b>' + bt.tele + '</b></div><div class="stat"><small>END</small><b>' + bt.end + '</b></div></div>' +
    '<div class="rprow">' + bt.rp.map(function (p, i) { return '<div class="rp"><i>RP' + (i + 1) + '</i><b>' + p + '%</b></div>'; }).join("") + '</div>' +
    '<div class="effect"><small>UNIQUE EFFECT</small>' + effect + '</div></div>' +
    '<div class="ftb"><span class="rar" aria-label="' + STARS[c.tier] + ' of 5 stars">' + stars(c.tier) + '</span><span class="sn">No. 000001</span></div></div></div></div></div></div>';
}
document.getElementById("cards").innerHTML = CARDS.map(card).join("");
/* Centers each photo on where its robot is (data/photos/focus.json, made by tools/photo_focus.py). */
function centerPhotos() {
  document.querySelectorAll("img.ph[data-fx]").forEach(function (img) {
    var box = img.parentElement.getBoundingClientRect(), w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !box.width) return;
    var fx = +img.dataset.fx, fy = +img.dataset.fy, scale = Math.max(box.width / w, box.height / h);
    var visW = box.width / (w * scale), visH = box.height / (h * scale);
    var pos = function (f, vis) { return vis >= 1 ? 50 : Math.min(100, Math.max(0, (f - vis / 2) / (1 - vis) * 100)); };
    img.style.objectPosition = pos(fx, visW) + "% " + pos(fy, visH) + "%";
  });
}
window.addEventListener("load", function () { centerPhotos(); document.body.setAttribute("data-ready", "1"); });
window.addEventListener("resize", centerPhotos);
</script>
