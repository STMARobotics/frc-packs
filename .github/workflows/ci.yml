name: Packs checks and deploy
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "data/**"
      - "cdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
permissions:
  contents: read
concurrency:
  group: packs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8765:8000']
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8765
      AWS_REGION: us-east-2
      INTEGRATION_ENABLED: 'true'
      INTEGRATION_ORG_ID: example-team
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: npm ci
      - run: npm run check:activity-contract
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - run: cargo test --manifest-path server/Cargo.toml --locked
      - name: Install Lambda build tooling
        run: pip install cargo-lambda
      - name: Build frontend and Lambda assets
        run: npm run build
      - name: Check infrastructure with built assets (including activity publishing)
        run: npm run cdk:test
      - name: Archive built assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf built-assets.tar.gz -C cdk .build
      - name: Upload built assets for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: built-assets.tar.gz
          if-no-files-found: error

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: .
      - name: Extract built assets
        run: tar -xzf built-assets.tar.gz -C cdk
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::738044534240:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-2
      - name: Deploy CDK stacks
        run: npm exec -w cdk -- cdk deploy --all --require-approval never
