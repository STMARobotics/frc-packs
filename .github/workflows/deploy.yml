# Builds the app for Lambda on Linux and deploys the CDK stacks.
# One-time setup is described in docs/aws.md.
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "data/**"
      - "cdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::738044534240:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install cargo-lambda
        run: pip install cargo-lambda
      - name: Install Node dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify CDK templates
        run: npm run cdk:test
      - name: Deploy CDK stacks
        run: npm exec -w cdk -- cdk deploy --all --require-approval never